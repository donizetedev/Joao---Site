<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Solicitação de Serviço - ONG DonTECH</title>
    <link rel="shortcut icon" href="./img/favicon.jpg?v=1" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logotipo">
                <img src="./img/logotipo.jpg" alt="Revisaritem.">
                <h1></h1>
            </div>

            <div class="Contato">
                <p>Telefone: (11) 2345-6789</p>
                <p>Av. Principal, 2026 - Portal das Primaveras.<br>
                São Carlos - SP, 01234-000</p>
            </div>

            <ul class="menu">
                <li><a href="index.html" class="botao-menu-home">Home</a></li>
                <li><a href="cadastro.html" class="botao-cadastro">Cadastro</a></li>
                <li><a href="projetos.html" class="botao-projetos">Projetos</a></li>
            </ul>
        </nav>
    </header>

    <main class="container-projeto">
        <section class="card-concluido"> 
            <form action="concluido.html" method="get" id="cadastro">
                <fieldset style="border: none; padding: 0; margin: 0;">
                    <h1 class="titulo-projeto" style="text-align: center;">Solicitar Orçamento</h1>
                    
                    <div class="bloco-projeto" style="text-align: left; margin-bottom: 20px;">
                        <label for="CPF" style="display: block; font-weight: bold; margin-bottom: 5px;">CPF:</label>
                        <input type="text" id="CPF" name="CPF" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" title="Formato requerido: 000.000.000-00" required style="width: 100%; padding: 10px; border: 1px solid var(--cor-borda); border-radius: 5px; font-size: var(--fonte-corpo);">
                    </div>

                    <div class="bloco-projeto" style="text-align: left; margin-bottom: 20px;">
                        <label for="telefone" style="display: block; font-weight: bold; margin-bottom: 5px;">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" pattern="\([0-9]{2}\)\s[0-9]{5}-[0-9]{4}" placeholder="(00) 00000-0000" title="Formato requerido: (00) 00000-0000" required style="width: 100%; padding: 10px; border: 1px solid var(--cor-borda); border-radius: 5px; font-size: var(--fonte-corpo);">
                    </div>

                    <div class="bloco-projeto" style="text-align: left; margin-bottom: 30px;">
                        <label for="CEP" style="display: block; font-weight: bold; margin-bottom: 5px;">CEP:</label>
                        <input type="text" id="CEP" name="CEP" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" title="Formato requerido: 00000-000" required style="width: 100%; padding: 10px; border: 1px solid var(--cor-borda); border-radius: 5px; font-size: var(--fonte-corpo);">
                    </div>

                    <button type="submit" class="botao-cadastro" style="width: 100%; border: none; padding: 12px; cursor: pointer; font-size: 1rem;">Enviar Orçamento</button>
                </fieldset>
            </form>
         </section>
    </main>

    <footer>
        <p>&copy; 2026 ONG DonTECH. Estudante: João Donizete de Castro Martins Moraes - RGM 49218590.</p>
    </footer>

</body>
</html>
